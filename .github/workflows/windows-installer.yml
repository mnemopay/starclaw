name: windows-installer

# Builds StarClaw-Setup-<version>.exe and proves it on a clean Windows VM: silent install, the console
# starts from the installed files, its API answers with the generated key, uninstall keeps user data.
#
# Code signing (SignPath, see docs/SIGNING.md) is OFF until the repository has the secret SIGNPATH_API_TOKEN and the
# variables (or secrets) SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and SIGNPATH_POLICY_SLUG. Without all four the
# workflow does exactly what it did before: it builds, smoke-tests and releases the installer UNSIGNED. With all four,
# on a version tag (or a manual run) the smoke-tested setup.exe is sent to SignPath, and the release publishes only the
# signed file; if signing fails or is not approved in time, nothing is released (it never falls back to unsigned).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["installer/**", ".github/workflows/windows-installer.yml", "src/app.ts", "src/cli.ts", "public/**", "package.json"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
      signing: ${{ steps.gate.outputs.signing }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Is code signing configured?
        id: gate
        shell: pwsh
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          HAS_ORG: ${{ (vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID) != '' }}
          HAS_PROJECT: ${{ (vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG) != '' }}
          HAS_POLICY: ${{ (vars.SIGNPATH_POLICY_SLUG || secrets.SIGNPATH_POLICY_SLUG) != '' }}
          # Sign release builds only: version tags, or a manual run. Never pull requests.
          WANTED: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        run: |
          $flags = @($env:HAS_TOKEN, $env:HAS_ORG, $env:HAS_PROJECT, $env:HAS_POLICY)
          $configured = -not ($flags -contains 'false')
          if (($flags -contains 'true') -and -not $configured) { Write-Host "::warning::SignPath is only partly configured (token=$env:HAS_TOKEN org=$env:HAS_ORG project=$env:HAS_PROJECT policy=$env:HAS_POLICY); building UNSIGNED" }
          $signing = if ($configured -and $env:WANTED -eq 'true') { 'true' } else { 'false' }
          Write-Host "code signing for this run: $signing (configured=$configured, release build=$env:WANTED)"
          "signing=$signing" | Out-File $env:GITHUB_OUTPUT -Append
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack
        id: pack
        shell: pwsh
        run: |
          $tgz = (npm pack --silent | Select-Object -Last 1).Trim()
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tgz=$tgz" | Out-File $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
      - name: Stage Node + StarClaw
        shell: pwsh
        run: ./installer/windows/build.ps1 -Tarball ${{ steps.pack.outputs.tgz }} -Out installer/windows/staging
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'could not install Inno Setup' } }
          & $iscc /Qp "/DAppVersion=${{ steps.pack.outputs.version }}" "/DStaging=$PWD\installer\windows\staging" installer\windows\starclaw.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          Get-ChildItem installer\windows\output | ForEach-Object { "{0}  {1:N1} MB  sha256 {2}" -f $_.Name, ($_.Length / 1MB), (Get-FileHash $_.FullName).Hash.ToLower() }

      - name: "Smoke test: install, run, uninstall"
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer\windows\output\StarClaw-Setup-*.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/GROQKEY=gsk_ci_dummy_never_called',"/LOG=$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; throw "installer exit $($p.ExitCode)" }
          $appDir = "$env:LOCALAPPDATA\Programs\StarClaw"
          $home_ = "$env:LOCALAPPDATA\StarClaw"
          foreach ($f in 'StarClaw.cmd','node\node.exe','app\node_modules\starclaw\dist\cli.js') { if (-not (Test-Path "$appDir\$f")) { throw "missing after install: $f" } }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\StarClaw.lnk")) { throw 'no Start menu shortcut' }
          if ((Get-Content "$home_\.env" -Raw) -notmatch 'GROQ_API_KEY=gsk_ci_dummy_never_called') { throw 'installer did not write the model key' }
          & "$appDir\node\node.exe" --version

          # Start the console from the installed files, no GROQ_API_KEY in the environment: it must come from .env.
          Remove-Item Env:GROQ_API_KEY -ErrorAction SilentlyContinue
          $log = "$env:RUNNER_TEMP\app.log"
          $srv = Start-Process "$appDir\node\node.exe" -ArgumentList "`"$appDir\app\node_modules\starclaw\dist\cli.js`"",'app','--no-open','--sandbox','process' -RedirectStandardOutput $log -RedirectStandardError "$log.err" -PassThru -WorkingDirectory $appDir
          $port = $null
          for ($i = 0; $i -lt 90 -and -not $port; $i++) {
            Start-Sleep 1
            if ($srv.HasExited) { Get-Content $log, "$log.err"; throw "app exited $($srv.ExitCode)" }
            $m = Select-String -Path $log -Pattern 'console: http://127\.0\.0\.1:(\d+)/' -ErrorAction SilentlyContinue
            if ($m -and (Select-String -Path $log -Pattern 'Ctrl\+C' -Quiet)) { $port = $m.Matches[0].Groups[1].Value }
          }
          if (-not $port) { Get-Content $log, "$log.err"; throw 'console did not start in 90s' }
          $key = ((Get-Content "$home_\.env") | Where-Object { $_ -match '^STARCLAW_API_KEY=' }) -replace '^STARCLAW_API_KEY=', ''
          try { Invoke-RestMethod "http://127.0.0.1:$port/api/status"; throw 'API answered without the key' } catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw } }
          $s = Invoke-RestMethod "http://127.0.0.1:$port/api/status" -Headers @{ Authorization = "Bearer $key" }
          if ($s.tainted -ne $false) { throw "unexpected status: $($s | ConvertTo-Json)" }
          if ((Invoke-WebRequest "http://127.0.0.1:$port/").Content -notmatch 'StarClaw Console') { throw 'console page not served' }
          if (-not (Test-Path "$home_\.starclaw\audit.jsonl")) { throw 'audit log not in the app home' }
          Write-Host "console OK on port $port; status $($s | ConvertTo-Json -Compress)"
          Stop-Process -Id $srv.Id

          $u = Start-Process "$appDir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          for ($i = 0; $i -lt 30 -and (Test-Path "$appDir\node"); $i++) { Start-Sleep 1 }
          if (Test-Path "$appDir\node") { throw 'uninstall left the program files' }
          if (-not (Test-Path "$home_\.starclaw\audit.jsonl")) { throw 'uninstall deleted user data' }
          Write-Host 'install, run, uninstall: OK (user data kept)'

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: StarClaw-Setup-${{ steps.pack.outputs.version }}-UNSIGNED
          path: installer/windows/output/*.exe
          if-no-files-found: error

  # Only when signing is configured (see the top of this file). Sends the exact setup.exe the smoke test proved to
  # SignPath, waits for the manual approval SignPath requires for every open-source release, checks the signature
  # and keeps the signed file as its own artifact. The bundled node.exe is NOT re-signed: it is the OpenJS
  # Foundation's binary, already signed by them, and SignPath Foundation only signs a project's own builds.
  sign:
    needs: build
    if: needs.build.outputs.signing == 'true'
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit to SignPath and wait for the signed installer
        id: signpath
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          # Every OSS signing request needs a human approval in SignPath; give the approver an hour.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(needs.build.outputs.version) }}
      - name: Check the signature
        shell: pwsh
        run: |
          $files = @(Get-ChildItem signed -Recurse -Filter 'StarClaw-Setup-*.exe')
          if ($files.Count -ne 1) { throw "expected exactly one signed StarClaw-Setup-*.exe, found $($files.Count)" }
          $f = $files[0]
          $sig = Get-AuthenticodeSignature $f.FullName
          Write-Host "$($f.Name): $($sig.Status) / $($sig.SignerCertificate.Subject) / timestamped: $($null -ne $sig.TimeStamperCertificate)"
          if ($sig.Status -ne 'Valid') { throw "signature status is $($sig.Status): $($sig.StatusMessage)" }
          if ($null -eq $sig.TimeStamperCertificate) { throw 'signature has no timestamp' }
          New-Item -ItemType Directory signed-out | Out-Null
          Move-Item $f.FullName (Join-Path signed-out $f.Name)
          "{0}  sha256 {1}" -f $f.Name, (Get-FileHash (Join-Path signed-out $f.Name)).Hash.ToLower()
      - uses: actions/upload-artifact@v4
        with:
          name: StarClaw-Setup-${{ needs.build.outputs.version }}-SIGNED
          path: signed-out/*.exe
          if-no-files-found: error

  # Version tags only: publish the installer that the smoke test above just proved, as a GitHub prerelease.
  # Signed when signing is configured; if signing was attempted and failed, this job does not run (no unsigned fallback).
  release:
    needs: [build, sign]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' &&
      (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && needs.build.outputs.signing != 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNED: ${{ needs.sign.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StarClaw-Setup-${{ needs.build.outputs.version }}-${{ needs.sign.result == 'success' && 'SIGNED' || 'UNSIGNED' }}
          path: dist
      - name: Checksums and notes
        run: |
          cd dist && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
          {
            echo "StarClaw ${{ needs.build.outputs.version }} for Windows (per-user install, no admin prompt). Bundles Node 25.9.0."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo '> **Code-signed.** Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/); see the [code signing policy](https://github.com/mnemopay/starclaw/blob/main/docs/SIGNING.md). A newly signed file can still show a SmartScreen prompt until it builds reputation. Check the download against SHA256SUMS.txt.'
            else
              echo '> **Not code-signed yet.** Windows SmartScreen will say "Windows protected your PC": click *More info* -> *Run anyway*. Check the download against SHA256SUMS.txt first.'
            fi
            echo
            echo 'This exact file was installed, run (console + API) and uninstalled on a clean Windows VM by CI before this release was published.'
            echo
            echo 'Also on npm: `npm install -g starclaw` (Node >= 25.9). See CHANGELOG.md for what changed.'
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: dist/notes.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
